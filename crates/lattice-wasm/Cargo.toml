[package]
name = "lattice-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen wrapper around lattice-core (docs/DESIGN.md §8): the `Lattice` class the worker drives. JSON strings cross the boundary; no u64/i64 in exported signatures."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lattice-core = { path = "../lattice-core" }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
serde_json = "1"
